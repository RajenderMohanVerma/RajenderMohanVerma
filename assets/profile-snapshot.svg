<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
<title id="title">Developer snapshot</title>
<desc id="desc">A compact developer profile snapshot showing focus areas, project mindset and professional direction.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0B1224"/><stop offset=".5" stop-color="#182A55"/><stop offset="1" stop-color="#291447"/></linearGradient></defs>
<rect width="1200" height="150" rx="20" fill="url(#g)"/>
<circle cx="1130" cy="15" r="120" fill="#22D3EE" opacity=".06"/>
<text x="42" y="37" fill="#67E8F9" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="3">02 / BUILDER SNAPSHOT</text>
<g font-family="Arial,sans-serif">
<rect x="40" y="56" width="250" height="64" rx="12" fill="#FFFFFF" fill-opacity=".06" stroke="#67E8F9" stroke-opacity=".35"/>
<text x="58" y="80" fill="#FFFFFF" font-size="14" font-weight="700">BUILD</text><text x="58" y="101" fill="#CBD5E1" font-size="11">Practical full-stack projects</text>
<rect x="310" y="56" width="250" height="64" rx="12" fill="#FFFFFF" fill-opacity=".06" stroke="#818CF8" stroke-opacity=".35"/>
<text x="328" y="80" fill="#FFFFFF" font-size="14" font-weight="700">SOLVE</text><text x="328" y="101" fill="#CBD5E1" font-size="11">DSA + application problem solving</text>
<rect x="580" y="56" width="250" height="64" rx="12" fill="#FFFFFF" fill-opacity=".06" stroke="#C084FC" stroke-opacity=".35"/>
<text x="598" y="80" fill="#FFFFFF" font-size="14" font-weight="700">LEARN</text><text x="598" y="101" fill="#CBD5E1" font-size="11">Modern web + backend technologies</text>
<rect x="850" y="56" width="310" height="64" rx="12" fill="#FFFFFF" fill-opacity=".06" stroke="#22D3EE" stroke-opacity=".35"/>
<text x="868" y="80" fill="#FFFFFF" font-size="14" font-weight="700">SHIP</text><text x="868" y="101" fill="#CBD5E1" font-size="11">Deploy, iterate and improve quality</text>
</g>
</svg>