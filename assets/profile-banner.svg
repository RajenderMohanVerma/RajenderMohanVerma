<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1020"/>
    <stop offset="0.5" stop-color="#111a35"/>
    <stop offset="1" stop-color="#071b2b"/>
    <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="12s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#00eaff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#00eaff" stop-opacity="1"/>
    <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="260" rx="22" fill="url(#bg)"/>
<circle cx="105" cy="55" r="55" fill="#00eaff" opacity=".07"><animate attributeName="r" values="45;75;45" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="1090" cy="205" r="80" fill="#8b5cf6" opacity=".07"><animate attributeName="r" values="65;95;65" dur="5s" repeatCount="indefinite"/></circle>
<g fill="#00eaff" opacity=".7">
 <circle cx="90" cy="190" r="3"><animate attributeName="cy" values="190;155;190" dur="3s" repeatCount="indefinite"/></circle>
 <circle cx="1110" cy="65" r="3"><animate attributeName="cy" values="65;105;65" dur="3.5s" repeatCount="indefinite"/></circle>
 <circle cx="1030" cy="45" r="2"><animate attributeName="cx" values="1030;1080;1030" dur="4s" repeatCount="indefinite"/></circle>
</g>
<text x="600" y="105" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">Rajender Mohan Verma</text>
<text x="600" y="145" text-anchor="middle" fill="#8be9ff" font-family="Arial, Helvetica, sans-serif" font-size="19">Full-Stack Developer • Python Developer • MCA</text>
<rect x="245" y="178" width="710" height="2" rx="1" fill="url(#line)" filter="url(#glow)"><animate attributeName="x" values="245;410;245" dur="4s" repeatCount="indefinite"/><animate attributeName="width" values="710;380;710" dur="4s" repeatCount="indefinite"/></rect>
<text x="600" y="213" text-anchor="middle" fill="#9aa4b2" font-family="Arial, Helvetica, sans-serif" font-size="14">Building practical • scalable • user-focused software</text>
</svg>