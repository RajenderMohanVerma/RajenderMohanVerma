<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#070B1A"/>
    <stop offset="45%" stop-color="#101A3A"/>
    <stop offset="100%" stop-color="#17102F"/>
    <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="18s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="cyanGlow">
    <stop offset="0" stop-color="#22D3EE" stop-opacity=".30"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="purpleGlow">
    <stop offset="0" stop-color="#A78BFA" stop-opacity=".28"/>
    <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="accent" x1="0" x2="1">
    <stop offset="0" stop-color="#22D3EE"/>
    <stop offset="50%" stop-color="#818CF8"/>
    <stop offset="100%" stop-color="#E879F9"/>
  </linearGradient>
  <linearGradient id="textAccent" x1="0" x2="1">
    <stop offset="0" stop-color="#67E8F9"/>
    <stop offset="100%" stop-color="#C4B5FD"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
</defs>

<title id="title">Rajender Mohan Verma — Developer Profile</title>
<desc id="desc">Animated developer profile banner with a modern dark gradient, glowing accents and floating code symbols.</desc>

<rect width="1200" height="300" rx="26" fill="url(#bg)"/>
<rect x="2" y="2" width="1196" height="296" rx="24" fill="none" stroke="#334155" stroke-opacity=".55"/>

<!-- Ambient glows -->
<circle cx="110" cy="70" r="170" fill="url(#cyanGlow)" filter="url(#softGlow)">
  <animate attributeName="opacity" values=".55;.9;.55" dur="5s" repeatCount="indefinite"/>
</circle>
<circle cx="1090" cy="235" r="190" fill="url(#purpleGlow)" filter="url(#softGlow)">
  <animate attributeName="opacity" values=".45;.8;.45" dur="6s" repeatCount="indefinite"/>
</circle>

<!-- Top terminal bar -->
<rect x="34" y="28" width="1132" height="34" rx="10" fill="#050816" fill-opacity=".72" stroke="#334155" stroke-opacity=".55"/>
<circle cx="55" cy="45" r="5" fill="#FB7185"/>
<circle cx="73" cy="45" r="5" fill="#FBBF24"/>
<circle cx="91" cy="45" r="5" fill="#34D399"/>
<text x="600" y="50" text-anchor="middle" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">RAJENDER.DEV • PROFILE README</text>

<!-- Floating code marks -->
<g font-family="monospace" font-weight="700" fill="#67E8F9" opacity=".5">
  <text x="76" y="132" font-size="25">&lt;/&gt;</text>
  <text x="1060" y="125" font-size="22">{ }</text>
  <text x="102" y="245" font-size="20">&lt;code&gt;</text>
  <text x="1050" y="248" font-size="20">_</text>
</g>
<g fill="#C4B5FD" opacity=".75">
  <circle cx="170" cy="92" r="3"><animate attributeName="cy" values="92;72;92" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="1015" cy="85" r="3"><animate attributeName="cy" values="85;105;85" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="165" r="2"><animate attributeName="cx" values="1080;1115;1080" dur="4s" repeatCount="indefinite"/></circle>
</g>

<!-- Main identity -->
<text x="600" y="125" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing=".3">Rajender Mohan Verma</text>
<text x="600" y="158" text-anchor="middle" fill="url(#textAccent)" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">Full-Stack Developer  •  Python Developer  •  MCA</text>

<!-- Animated accent line -->
<rect x="280" y="181" width="640" height="3" rx="2" fill="#1E293B"/>
<rect x="280" y="181" width="260" height="3" rx="2" fill="url(#accent)" filter="url(#glow)">
  <animate attributeName="x" values="280;660;280" dur="4.5s" repeatCount="indefinite"/>
  <animate attributeName="width" values="260;180;260" dur="4.5s" repeatCount="indefinite"/>
</rect>

<!-- Focus chips -->
<g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">
  <rect x="345" y="205" width="120" height="30" rx="15" fill="#0E7490" fill-opacity=".20" stroke="#22D3EE" stroke-opacity=".65"/>
  <text x="405" y="224" text-anchor="middle" fill="#67E8F9">WEB DEVELOPMENT</text>
  <rect x="480" y="205" width="105" height="30" rx="15" fill="#4F46E5" fill-opacity=".20" stroke="#818CF8" stroke-opacity=".65"/>
  <text x="532" y="224" text-anchor="middle" fill="#C4B5FD">PYTHON</text>
  <rect x="600" y="205" width="105" height="30" rx="15" fill="#7E22CE" fill-opacity=".20" stroke="#E879F9" stroke-opacity=".65"/>
  <text x="652" y="224" text-anchor="middle" fill="#F0ABFC">JAVA</text>
  <rect x="720" y="205" width="135" height="30" rx="15" fill="#0F766E" fill-opacity=".20" stroke="#34D399" stroke-opacity=".65"/>
  <text x="787" y="224" text-anchor="middle" fill="#6EE7B7">PROBLEM SOLVING</text>
</g>

<text x="600" y="270" text-anchor="middle" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="13">Building practical • scalable • user-focused software</text>
</svg>