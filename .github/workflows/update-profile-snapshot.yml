name: Update Profile Snapshot

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update repository count
        run: python .github/scripts/update_profile_snapshot.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-snapshot.svg
          if git diff --cached --quiet; then
            echo "No profile snapshot changes."
          else
            git commit -m "chore: update profile repository count"
            git push
          fi
