name: Generate Contribution Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: RajenderMohanVerma
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Copy generated snake assets
        run: |
          mkdir -p assets/contribution-snake
          cp dist/github-contribution-grid-snake.svg assets/contribution-snake/
          cp dist/github-contribution-grid-snake-dark.svg assets/contribution-snake/

      - name: Commit updated snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-snake

          if git diff --cached --quiet; then
            echo "No contribution snake changes."
            exit 0
          fi

          git commit -m "chore: update contribution snake"
          git pull --rebase origin main
          git push
